[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "code-journey"
version = "0.1.0"
description = "A gamified command-line trainer for C and Python, graded through real git commands."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
journey = "journey.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
journey = ["content/**/*"]

[tool.ruff]
line-length = 100
target-version = "py311"
# Task packs are learner-facing material (starters, model solutions, deliberately bad mutants).
extend-exclude = ["src/journey/content"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]  # `ruff format` wraps code; long message strings are fine
