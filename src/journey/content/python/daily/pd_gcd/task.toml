[[cases]]
name = "twelve and eighteen"
args = ["12", "18"]
stdout = "6\n"

[[cases]]
name = "coprime numbers"
args = ["7", "13"]
stdout = "1\n"

[[cases]]
name = "a quarter"
args = ["100", "75"]
stdout = "25\n"

[[cases]]
name = "zero"
args = ["0", "5"]
stdout = "5\n"
hidden = true
hint = "gcd(0, n) is n"

[[cases]]
name = "a classic"
args = ["1071", "462"]
stdout = "21\n"
hidden = true
hint = "a classic example"

[[cases]]
name = "huge numbers"
args = ["600851475143", "6857"]
stdout = "6857\n"
hidden = true
hint = "large numbers: be smarter than trying every divisor"

[[cases]]
name = "two huge numbers"
args = ["3000000021", "5000000035"]
stdout = "1000000007\n"
hidden = true
